<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 760" preserveAspectRatio="none" fill="none">
<style>
.star { fill: #f3dab0; opacity: .45; animation: star-pass 35.0s ease-in-out infinite; }
.halo { fill: url(#glow); opacity: 0; animation: halo-pass 35.0s ease-in-out infinite; }
.trace { stroke: #ffe3ab; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: line-pass 35.0s linear infinite; }
@keyframes star-pass { 0%, 3%, 100% { opacity: .45; } 1%, 2% { opacity: 1; } }
@keyframes halo-pass { 0%, 4%, 100% { opacity: 0; } 1%, 2% { opacity: .85; } }
@keyframes line-pass { 0% { opacity: 0; stroke-dashoffset: 1; } 1% { opacity: .8; } 4% { opacity: .8; stroke-dashoffset: 0; } 6%, 100% { opacity: 0; stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .star, .halo, .trace { animation: none; } }
</style>
