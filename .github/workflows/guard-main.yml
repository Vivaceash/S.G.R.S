name: Guard Main Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  protect-main:
    name: Enforce Main Branch Protection
    if: github.actor != 'Vivaceash'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert unauthorized push and backup changes
        run: |
          set -e
          ACTOR="${{ github.actor }}"
          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          RESCUE_BRANCH="rescue/${ACTOR}-${TIMESTAMP}"

          echo "⚠️ Push no autorizado detectado en 'main' por @${ACTOR}."

          # Configurar identidad de git para el bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Respaldar los commits no autorizados en una rama de rescate para no perder trabajo
          echo "Creando rama de rescate: ${RESCUE_BRANCH}..."
          git branch "${RESCUE_BRANCH}" "${CURRENT_SHA}"
          git push origin "${RESCUE_BRANCH}"

          # 2. Restaurar la rama main al commit previo autorizado
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            echo "Restaurando 'main' a ${BEFORE_SHA}..."
            git push origin "+${BEFORE_SHA}:refs/heads/main"
          else
            echo "No se pudo determinar el commit anterior. Abortando force-rollback automático."
            exit 1
          fi

          echo "✅ Rama 'main' restaurada con éxito."
          echo "RESCUE_BRANCH_NAME=${RESCUE_BRANCH}" >> $GITHUB_ENV

      - name: Notificar vía Issue sobre el rollback
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const actor = '${{ github.actor }}';
            const rescueBranch = process.env.RESCUE_BRANCH_NAME || 'no generada';
            const beforeSha = '${{ github.event.before }}';
            const commitSha = '${{ github.sha }}';
            
            const issueTitle = `🚨 Push directo no autorizado a main revertido (@${actor})`;
            const issueBody = `### 🛡️ Protección automática de la rama \`main\`
            
            El usuario **@${actor}** realizó un push o merge directo a \`main\` sin la debida autorización.
            
            **Acciones tomadas automáticamente:**
            1. 🔄 La rama \`main\` fue revertida inmediatamente al commit seguro previo: \`${beforeSha}\`.
            2. 💾 Los cambios enviados por @${actor} fueron respaldados en la rama: **\`${rescueBranch}\`** para que ningún trabajo se pierda.
            
            ---
            **Instrucciones para el colaborador:**
            - Trabaja siempre en ramas de características o usa la rama de respaldo creada: \`${rescueBranch}\`.
            - Abre un **Pull Request** hacia \`main\` y espera la revisión y aprobación de **@Vivaceash**.`;

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody
              });
            } catch (err) {
              console.log('Error creando el issue:', err);
            }
