name: Verify SGRS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-setup:
    name: Clean Windows installation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Set up supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Verify first installation and repeated setup without credentials
        run: python tests/check_clean_setup.py --services

  verify:
    name: Backend, frontend and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up patched Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up patched Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --require-hashes -r requirements.lock

      - name: Audit Python dependencies
        run: |
          pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes -r requirements.lock
          for api in "API Forti" "API Omni" "API Inventarios"; do
            pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes -r "$api/requirements.lock"
          done

      - name: Verify Python packages
        run: |
          python -m pip check
          python -m compileall -q API\ Forti API\ Omni API\ Inventarios *.py

      - name: Run gateway tests
        run: python -m pytest -q -ra

      - name: Run API tests
        run: |
          (cd "API Forti" && python -m pytest -q -ra)
          (cd "API Omni" && python -m pytest -q -ra)
          (cd "API Inventarios" && python -m pytest -q -ra)

      - name: Install frontend dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci --prefix Dashboard

      - name: Build frontend
        run: npm run build --prefix Dashboard

      - name: Install browser for frontend tests
        run: npm exec --prefix Dashboard -- playwright install --with-deps chromium

      - name: Run frontend tests
        run: |
          npm run dev --prefix Dashboard -- --host 127.0.0.1 > /tmp/sgrs-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          SGRS_TEST_URL=http://127.0.0.1:5173 npm test --prefix Dashboard

      - name: Audit frontend dependencies
        run: npm audit --prefix Dashboard --audit-level=low
